name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && 1 || 0 }}
          persist-credentials: false

      # GitHub disables a public repo's schedule after 60 days without a commit; re-enabling resets that clock.
      - if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY"

      - id: apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apps=$(scripts/apps.sh | xargs)
          if [ -z "$apps" ]; then
            echo "::error::No app sites found; refusing to deploy the home page alone."
            exit 1
          fi
          fingerprint=$(scripts/fingerprint.sh $apps)
          echo "list=$apps" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - id: deployed
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .deployed
          key: site-${{ steps.apps.outputs.fingerprint }}
          lookup-only: true

      - id: verified
        if: github.event_name == 'schedule' && steps.deployed.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passes=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success&per_page=1" -q .total_count)
          if [ "$passes" -gt 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$GITHUB_SHA has no passing push run, so the schedule will not deploy it."
          fi

      - id: work
        run: |
          echo "build=${{ github.event_name != 'schedule' || (steps.deployed.outputs.cache-hit != 'true' && steps.verified.outputs.passed == 'true') }}" >> "$GITHUB_OUTPUT"
          echo "check=${{ github.event_name != 'schedule' }}" >> "$GITHUB_OUTPUT"

      - if: steps.work.outputs.build == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - if: steps.work.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.work.outputs.build == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.work.outputs.check == 'true'
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5

      - if: steps.work.outputs.check == 'true'
        run: pnpm nx format:check

      - if: steps.work.outputs.check == 'true'
        run: pnpm i18n:check

      - if: steps.work.outputs.check == 'true'
        run: pnpm nx affected -t lint typecheck test build build-storybook docker:build

      - if: steps.work.outputs.check == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.work.outputs.check == 'true'
        run: pnpm nx affected -t e2e visual --parallel=1

      - if: failure() && steps.work.outputs.check == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright
          path: dist/.playwright
          if-no-files-found: ignore

      - if: steps.work.outputs.build == 'true'
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - if: steps.work.outputs.build == 'true'
        env:
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build.sh ${{ steps.apps.outputs.list }}

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.work.outputs.build == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy
          touch .deployed

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.work.outputs.build == 'true' && steps.deployed.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .deployed
          key: site-${{ steps.apps.outputs.fingerprint }}
